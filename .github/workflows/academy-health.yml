name: Night Academy production health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read
  issues: write

jobs:
  academy-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify website and public API
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://chaybuilds.github.io/niteacademy-site/'
          API='https://succvbtctjkzsowotcsy.supabase.co/functions/v1/academy-apply'
          curl --fail --silent --show-error --location --retry 2 --max-time 25 "$SITE" -o /tmp/academy-page.html
          grep -q 'id="academy-form"' /tmp/academy-page.html
          grep -q 'https://discord.gg/Dm6Hbq68Wt' /tmp/academy-page.html
          # Follow the actual Discord API, not merely a literal link in HTML.
          curl --fail --silent --show-error --retry 2 --max-time 20 'https://discord.com/api/v10/invites/Dm6Hbq68Wt?with_counts=true' -o /tmp/academy-invite.json
          node -e 'const i=JSON.parse(require("node:fs").readFileSync("/tmp/academy-invite.json","utf8")); if(i.code!=="Dm6Hbq68Wt"||i.guild?.id!=="1568427976687878275"){console.error("Verified official NITERUN invite invalid or wrong server");process.exit(1)}'
          curl --fail --silent --show-error --retry 2 --max-time 25 "$API" -o /tmp/academy-health.json
          grep -q '"state":"ready"' /tmp/academy-health.json
          code=$(curl --silent --show-error --output /tmp/academy-invalid.json --write-out '%{http_code}' --max-time 25 \
            -X POST -H 'Origin: https://chaybuilds.github.io' -H 'Content-Type: application/json' \
            --data '{"full_name":"x","consent":false}' "$API")
          test "$code" = '422'
          echo 'Academy public page, Discord link, API health and validation passed.'
      - name: Open deduplicated incident if health fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='Night Academy production health check failure'
          existing=$(gh issue list -R "$GH_REPO" --state open --limit 100 --json title \
            --jq '[.[] | select(.title == "Night Academy production health check failure")] | length')
          if [ "$existing" = "0" ]; then
            gh issue create -R "$GH_REPO" --title "$title" \
              --body "The scheduled Night Academy website/API health check failed. Inspect: https://github.com/$GH_REPO/actions/workflows/academy-health.yml. This is a technical incident, not revenue evidence."
          else
            echo 'An open incident already exists; not making a duplicate.'
          fi
