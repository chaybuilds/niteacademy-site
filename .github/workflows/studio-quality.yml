name: NiteAcademy Studio — curriculum and release quality
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "member/**"
      - "tests/waitlist.test.mjs"
      - "assets/**"
      - "studio/**"
      - "tests/studio.test.mjs"
      - "tests/homepage-ux.test.mjs"
      - "tests/domain-readiness.test.mjs"
      - "scripts/domain-readiness.mjs"
      - "scripts/academy-gateway-smoke.mjs"
      - "scripts/consignment-ledger.mjs"
      - "tests/consignment-ledger.test.mjs"
      - "supabase/**"
      - ".github/workflows/studio-quality.yml"
  pull_request:
    paths:
      - "index.html"
      - "member/**"
      - "tests/waitlist.test.mjs"
      - "assets/**"
      - "studio/**"
      - "tests/studio.test.mjs"
      - "tests/homepage-ux.test.mjs"
      - "tests/domain-readiness.test.mjs"
      - "scripts/domain-readiness.mjs"
      - "scripts/academy-gateway-smoke.mjs"
      - "supabase/**"
      - ".github/workflows/studio-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get current repository
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser module syntax
        run: |
          node --check assets/academy.mjs
          node --check assets/waitlist.js
          node --check scripts/consignment-ledger.mjs
          node --check studio/content.mjs
          node --check studio/app.mjs
          node --check studio/arena.mjs
          node --check scripts/domain-readiness.mjs
          node --check scripts/academy-gateway-smoke.mjs
      - name: Validate all learning tracks and practice scoring
        run: node --test tests/studio.test.mjs tests/domain-readiness.test.mjs tests/homepage-ux.test.mjs tests/consignment-ledger.test.mjs tests/waitlist.test.mjs
      - name: Verify Academy signup and retained Studio routes
        run: |
          grep -q 'id="waitlist-form"' index.html
          grep -q 'id="waitlist-consent"' index.html
          grep -q 'id="auth-form"' member/index.html
          grep -q 'id="dashboard-view" hidden' member/index.html
          grep -q 'href="studio/"' member/index.html
          grep -q 'id="arena-provider"' studio/index.html
          grep -q 'id="portfolio"' studio/index.html
